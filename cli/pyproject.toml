[project]
name = "joytrunk"
version = "1.0.0"
description = "JoyTrunk CLI — 本地 7×24 智能体员工，像跟真人一样聊天，你的 AI 团队把事情做完"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JoyTrunk contributors" }]
keywords = ["ai", "agent", "joytrunk", "assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-clack>=0.1.0",
    "mcp>=1.26.0,<2.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "sqlmodel>=0.0.14,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "defusedxml>=0.7.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "websockets>=14.0,<17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.1.0",
    "mkdocs>=1.5.0,<2.0.0",
]

[project.scripts]
joytrunk = "joytrunk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joytrunk"]

[tool.hatch.build.targets.wheel.force-include]
"joytrunk/templates" = "joytrunk/templates"
"joytrunk/server" = "joytrunk/server"
"joytrunk/docs" = "joytrunk/docs"
"joytrunk/ui" = "joytrunk/ui"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_llm: tests that call real LLM API (require OPENAI_API_KEY)",
]
