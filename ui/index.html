<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src * file: blob:;">
  <title>Video</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      background: transparent;
      user-select: none;
      outline: none;
      border: none;
    }
    /* 悬浮窗根：质感灰底、圆角、网格布局；data-agent-count="0" 时显示菜单；与小菜单同款边框 */
    .overlay-root {
      width: 100%; height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #252525;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%),
        linear-gradient(180deg, #2a2a2a 0%, #1e1e1e 100%);
      box-shadow: none;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: default;
      position: relative;
    }
    .overlay-root[data-agent-count="0"] {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    /* 小菜单：与 agent 风格一致，仅 count=0 时显示 */
    .overlay-menu {
      display: none;
      width: 100%;
      flex: 1;
      flex-direction: column;
      padding: 0;
      gap: 0;
    }
    .overlay-root[data-agent-count="0"] .overlay-menu {
      display: flex;
    }
    /* 第一部分：顶部移动条，单独 hover 区域 */
    .overlay-menu-drag {
      flex-shrink: 0;
      height: 8px;
      cursor: move;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px 12px 0 0;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .overlay-menu-drag::before {
      content: '';
      width: 14px;
      height: 2px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 1px;
      box-shadow: 0 -3px 0 rgba(255, 255, 255, 0.35), 0 3px 0 rgba(255, 255, 255, 0.35);
    }
    .overlay-menu-drag:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .overlay-menu-drag:hover::before {
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 -3px 0 rgba(255, 255, 255, 0.55), 0 3px 0 rgba(255, 255, 255, 0.55);
    }
    /* 第二部分：状态区，单独 hover 区域，点击显示主界面 */
    .overlay-menu-status {
      flex-shrink: 0;
      padding: 8px 8px 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      border-radius: 6px;
      margin: 0 4px;
    }
    .overlay-menu-status:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 0 1px #42a5f5;
    }
    .overlay-menu-status .status-success {
      color: #43a047;
      font-weight: 500;
    }
    /* 第三部分：底部两按钮 — 增加(蓝)、主页面(灰) */
    .overlay-menu-btns {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      padding: 6px 8px 10px;
    }
    .overlay-menu-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .overlay-menu-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .overlay-menu-btn[data-action="add-agent"] {
      background: rgba(66, 165, 245, 0.5);
      color: #fff;
    }
    .overlay-menu-btn[data-action="add-agent"]:hover {
      background: rgba(66, 165, 245, 0.7);
    }
    .overlay-menu-btn.open-main {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.95);
      font-size: 12px;
    }
    .overlay-menu-btn.open-main:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    /* 视频网格：count>=1 时显示 */
    .overlay-slots {
      display: none;
      width: 100%;
      height: 100%;
      gap: 0;
    }
    .overlay-root[data-agent-count="1"] .overlay-slots,
    .overlay-root[data-agent-count="2"] .overlay-slots,
    .overlay-root[data-agent-count="3"] .overlay-slots,
    .overlay-root[data-agent-count="4"] .overlay-slots {
      display: grid;
    }
    .overlay-root[data-agent-count="1"] .overlay-slots {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    .overlay-root[data-agent-count="1"] .agent-slot:nth-child(n+2) { display: none; }
    /* 2 格：横排 */
    .overlay-root[data-agent-count="2"] .overlay-slots {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .overlay-root[data-agent-count="2"] .agent-slot:nth-child(n+3) { display: none; }
    /* 3-4 格：2×2 */
    .overlay-root[data-agent-count="3"] .overlay-slots,
    .overlay-root[data-agent-count="4"] .overlay-slots {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(n+4) { display: none; }
    /* 每格：分割线 + 按位置圆角；视频居中，名称浮在右下角 */
    .agent-slot {
      width: 100%; height: 100%;
      min-width: 0; min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border-right: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    /* 悬停高亮：用 ::after 叠在内容之上，避免被视频遮挡；颜色与空闲状态灯一致 */
    .agent-slot::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 2px transparent;
      background-color: transparent;
      transition: box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .agent-slot.hover::after {
      box-shadow: inset 0 0 0 2px #43a047;
      background-color: rgba(67, 160, 71, 0.12);
    }
    /* 悬停时右上角显示关闭按钮，点击关闭该 agent */
    .agent-slot .agent-slot-close {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .agent-slot .agent-slot-close:hover {
      background: rgba(229, 57, 53, 0.9);
      color: #fff;
    }
    .agent-slot.hover .agent-slot-close {
      opacity: 1;
      pointer-events: auto;
    }
    .agent-slot .slot-media {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* 让 hover 落在 .agent-slot 上 */
    }
    /* 底部条：同一块背景上 左侧单灯(随状态变色) + 右侧昵称 */
    .agent-slot .agent-slot-footer {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      pointer-events: none;
    }
    .agent-slot .agent-name {
      flex: 1;
      min-width: 0;
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255,255,255,0.95);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: system-ui, -apple-system, sans-serif;
      text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 1px 2px rgba(0,0,0,0.9);
    }
    /* 6 盏灯大小一致（整数像素避免某一盏被缩成更小），绕共同中心旋转 */
    .agent-slot .agent-status {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      position: relative;
      transform-origin: 8px 8px;
      animation: agent-status-spin var(--spin-duration, 2s) linear infinite;
    }
    .agent-slot .agent-status .light {
      position: absolute;
      width: 4px;
      height: 4px;
      left: 6px;
      top: 6px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
      transform-origin: 2px 2px;
      animation: agent-light-breathe var(--breathe-duration, 1.6s) ease-in-out infinite;
    }
    .agent-slot .agent-status .light:nth-child(1) { transform: rotate(0deg) translateY(-4px); animation-delay: 0s; }
    .agent-slot .agent-status .light:nth-child(2) { transform: rotate(60deg) translateY(-4px); animation-delay: 0.27s; }
    .agent-slot .agent-status .light:nth-child(3) { transform: rotate(120deg) translateY(-4px); animation-delay: 0.53s; }
    .agent-slot .agent-status .light:nth-child(4) { transform: rotate(180deg) translateY(-4px); animation-delay: 0.8s; }
    .agent-slot .agent-status .light:nth-child(5) { transform: rotate(240deg) translateY(-4px); animation-delay: 1.07s; }
    .agent-slot .agent-status .light:nth-child(6) { transform: rotate(300deg) translateY(-4px); animation-delay: 1.33s; }
    .agent-slot .agent-status[data-state="idle"] .light { background: #43a047; }
    .agent-slot .agent-status[data-state="thinking"] .light { background: #fbc02d; }
    .agent-slot .agent-status[data-state="running"] .light { background: #e53935; }
    /* 小球颜色可由 JS 在“到达最高点”时单独设为 inline background，覆盖上面规则 */
    @keyframes agent-light-breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes agent-status-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .overlay-root[data-agent-count="1"] .agent-slot { border: none; }
    .overlay-root[data-agent-count="2"] .agent-slot { border-bottom: none; }
    .overlay-root[data-agent-count="2"] .agent-slot:nth-child(2) { border-right: none; }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(2) { border-right: none; }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(3) { border-right: none; border-bottom: none; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(2n) { border-right: none; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(n+3) { border-bottom: none; }
    .overlay-root[data-agent-count="1"] .agent-slot:first-child { border-radius: 12px; }
    .overlay-root[data-agent-count="2"] .agent-slot:nth-child(1) { border-radius: 12px 0 0 12px; }
    .overlay-root[data-agent-count="2"] .agent-slot:nth-child(2) { border-radius: 0 12px 12px 0; }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(1) { border-radius: 12px 0 0 0; }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(2) { border-radius: 0 12px 0 0; }
    .overlay-root[data-agent-count="3"] .agent-slot:nth-child(3) { border-radius: 0 0 0 12px; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(1) { border-radius: 12px 0 0 0; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(2) { border-radius: 0 12px 0 0; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(3) { border-radius: 0 0 0 12px; }
    .overlay-root[data-agent-count="4"] .agent-slot:nth-child(4) { border-radius: 0 0 12px 0; }
    /* 视频缩放容器 */
    .agent-slot .scaler {
      flex-shrink: 0;
      transform-origin: center center;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      pointer-events: none; /* 与 .slot-media 一致，保证 slot 收到 hover */
    }
    .agent-slot .scaler.ready { opacity: 1; }
    .agent-slot video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  </style>
</head>
<body>
  <div class="overlay-root" data-agent-count="0" title="点击打开主页面">
    <div class="overlay-menu">
      <div class="overlay-menu-drag" title="拖动移动"></div>
      <div class="overlay-menu-status">
        <span class="overlay-menu-username">JoyTrunk</span>
        <span class="status-success">连接成功</span>
      </div>
      <div class="overlay-menu-btns">
        <button type="button" class="overlay-menu-btn" data-action="add-agent" title="添加 Agent" aria-label="添加">+</button>
        <button type="button" class="overlay-menu-btn open-main" data-action="open-main" title="显示主页面" aria-label="主页面">⛶</button>
      </div>
    </div>
    <div class="overlay-slots">
    <div class="agent-slot"><button type="button" class="agent-slot-close" data-slot="0" title="关闭此 Agent" aria-label="关闭">×</button><div class="slot-media"><div class="scaler"><video id="video0" muted playsinline></video></div></div><div class="agent-slot-footer"><div class="agent-status" data-slot="0" data-state="idle"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div><span class="agent-name" data-slot="0">Agent 1</span></div></div>
    <div class="agent-slot"><button type="button" class="agent-slot-close" data-slot="1" title="关闭此 Agent" aria-label="关闭">×</button><div class="slot-media"><div class="scaler"><video id="video1" muted playsinline></video></div></div><div class="agent-slot-footer"><div class="agent-status" data-slot="1" data-state="idle"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div><span class="agent-name" data-slot="1">Agent 2</span></div></div>
    <div class="agent-slot"><button type="button" class="agent-slot-close" data-slot="2" title="关闭此 Agent" aria-label="关闭">×</button><div class="slot-media"><div class="scaler"><video id="video2" muted playsinline></video></div></div><div class="agent-slot-footer"><div class="agent-status" data-slot="2" data-state="idle"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div><span class="agent-name" data-slot="2">Agent 3</span></div></div>
    <div class="agent-slot"><button type="button" class="agent-slot-close" data-slot="3" title="关闭此 Agent" aria-label="关闭">×</button><div class="slot-media"><div class="scaler"><video id="video3" muted playsinline></video></div></div><div class="agent-slot-footer"><div class="agent-status" data-slot="3" data-state="idle"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div><span class="agent-name" data-slot="3">Agent 4</span></div></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
